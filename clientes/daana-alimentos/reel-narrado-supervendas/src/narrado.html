<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Playfair'; font-style: normal; font-weight: 700; src: url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2); }
@font-face { font-family: 'Playfair'; font-style: italic; font-weight: 700; src: url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-italic.woff2); }
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2); }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1a0a04; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 45%; }
.grad { position: absolute; left: 0; right: 0; bottom: 0; height: 900px; background: linear-gradient(rgba(20,8,2,0), rgba(20,8,2,.82)); }
.bg { position: absolute; inset: -120px; background-size: cover; background-position: center; filter: blur(46px) brightness(.42) saturate(1.25); }
.panel { position: absolute; left: 60px; width: 960px; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); border: 4px solid rgba(255,240,215,.85); box-sizing: border-box; }
.panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cap { position: absolute; left: 60px; width: 960px; top: 1360px; text-align: center; font-family: 'Playfair', serif; font-weight: 700; font-size: 54px; line-height: 1.25; color: #fff6e6; text-shadow: 0 3px 14px rgba(0,0,0,.75); }
#cap em { font-style: italic; color: #ffd27a; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }
.small { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 1px; color: #fff6e6; }
.pill { display: inline-block; background: #fff6e6; color: #d10019; border-radius: 22px; padding: 10px 22px 14px; margin: 0 10px; font-family: 'Montserrat'; font-weight: 800; font-size: 74px; line-height: 1; }
.pill small { display: block; font-size: 24px; font-weight: 700; letter-spacing: 1px; margin-top: 4px; }
.t { position: absolute; left: 70px; width: 940px; text-align: center; font-family: 'Playfair', serif; font-weight: 700; color: #fff6e6; font-size: 66px; line-height: 1.18; text-shadow: 0 4px 18px rgba(0,0,0,.55); font-variant-numeric: lining-nums; }
.t em { font-style: italic; color: #ffd27a; }
#prodWrap img { position: absolute; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const XF = 1.0, DUR = 59;

// AI scenes (Ana's memory) are full-bleed; everything about the brand uses real/approved material only
const SCENES = [
  { t0: 0,    t1: 6,    full: 'cena1.jpg', kb: [1.12, 1.0] },
  { t0: 6,    t1: 12.5, full: 'cena2.jpg', kb: [1.0, 1.1] },
  { t0: 12.5, t1: 21,   full: 'cena3.jpg', kb: [1.0, 1.12] },
  { t0: 21,   t1: 26,   full: 'cena4.jpg', kb: [1.1, 1.0] },
  { t0: 26,   t1: 32,   panel: 'legado.jpg', ph: 960 * 915 / 1080 },
  { t0: 32,   t1: 38,   products: true },
  { t0: 38,   t1: 44,   panel: 'stand.jpg', ph: 960 * 512 / 794 },
  { t0: 44,   t1: DUR,  invite: true },
];
// captions = narration lines (start, end)
const CAPS = [
  [0.8, 5.6, 'Minha avó Ana acordava<br><em>antes do sol.</em>'],
  [6.6, 12.0, 'Era da terra que ela tirava o sustento…<br><em>e o tempero da vida.</em>'],
  [13.0, 16.6, 'No fogão a lenha,<br><em>tudo virava carinho:</em>'],
  [16.6, 20.8, 'manauê, cocada, bolo de aipim,<br><em>café passado na hora.</em>'],
  [21.5, 25.6, 'Na mesa dela,<br><em>sempre cabia mais um.</em>'],
  [26.6, 31.8, 'Eu cresci ali.<br>E prometi que essa história<br><em>não ia se perder.</em>'],
];

const stage = $('#stage');
const els = SCENES.map(sc => {
  const d = document.createElement('div'); d.className = 'scene';
  if (sc.full) d.innerHTML = `<img class="full" src="${sc.full}"><div class="grad"></div>`;
  if (sc.panel) {
    const top = Math.round((1920 - sc.ph) / 2 - 260);
    d.innerHTML = `<div class="bg" style="background-image:url(${sc.panel})"></div>
      <div class="panel" style="top:${top}px;height:${sc.ph}px"><img src="${sc.panel}"></div>`;
    if (sc.panel === 'stand.jpg') d.innerHTML += `<div class="t" id="standT" style="top:${top + sc.ph + 70}px">Agora, a cozinha da minha avó<br><em>abre as portas para você.</em></div>`;
  }
  if (sc.products) d.innerHTML = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #ec0a24 0%, #c80018 65%, #8f0010 100%)"></div>
      <img src="logo_keyline.png" class="plogo" style="position:absolute;left:190px;top:330px;width:700px">
      <div id="prodWrap" style="position:absolute;inset:0"></div>
      <div class="t" id="prodT" style="top:1300px;font-size:56px">Hoje, a DAANA leva esse cuidado<br><em>da Bahia para a sua mesa.</em></div>`;
  if (sc.invite) d.innerHTML = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #ec0a24 0%, #c80018 65%, #8f0010 100%)"></div>
      <div class="panel" style="top:250px;height:${960 * 396 / 856}px"><img src="centro.jpg"></div>
      <img src="logo_keyline.png" class="ilogo" style="position:absolute;left:290px;top:740px;width:500px">
      <div class="t" id="inv1" style="top:925px;font-size:54px">Vem conhecer a cozinha de Ana<br><em>no Supervendas Sergipe.</em></div>
      <div id="inv2" style="position:absolute;left:0;width:1080px;top:1110px;text-align:center">
        <span class="pill">26<small>OUTUBRO</small></span><span class="pill">27<small>OUTUBRO</small></span><span class="pill">28<small>OUTUBRO</small></span></div>
      <div class="small" id="inv3" style="position:absolute;left:0;width:1080px;top:1270px;text-align:center">Centro de Convenções AM Malls</div>
      <div class="t" id="inv4" style="top:1350px;font-size:62px"><em>A gente te espera.</em></div>
      <div class="small" id="inv5" style="position:absolute;left:0;width:1080px;top:1480px;text-align:center;font-weight:800">@daanaoficial</div>`;
  stage.appendChild(d); return d;
});
const cap = document.createElement('div'); cap.id = 'cap'; stage.appendChild(cap);
const vig = document.createElement('div'); vig.id = 'vig'; stage.appendChild(vig);

const PRODS = ['005', '007', '011', 'can1', 'molho_ingles', 'dende1', 'molho4', 'cha_hortela', 'c_capim_limao', '001', '003', '002'];
const pw = document.querySelector('#prodWrap');
const pimgs = PRODS.map(n => { const i = new Image(); i.src = 'prod/' + n + '.png'; pw.appendChild(i); return i; });
const rise = (el, t, a) => { el.style.opacity = ramp(t, a, a + .7); el.style.transform = `translateY(${20 * (1 - ramp(t, a, a + .7))}px)`; };

function render(t) {
  SCENES.forEach((sc, i) => {
    const d = els[i];
    const fin = i === 0 ? ramp(t, 0, .8) : ramp(t, sc.t0 - XF / 2, sc.t0 + XF / 2);
    const fout = i === SCENES.length - 1 ? ramp(t, DUR - .8, DUR) : ramp(t, sc.t1 - XF / 2, sc.t1 + XF / 2);
    const op = Math.min(fin, 1 - fout);
    d.style.opacity = op; d.style.display = op > 0 ? 'block' : 'none';
    if (op <= 0) return;
    const p = clamp((t - sc.t0 + XF / 2) / (sc.t1 - sc.t0 + XF));
    if (sc.full) { const [a, b] = sc.kb; d.querySelector('.full').style.transform = `scale(${1.02 + (a - 1) + (b - a) * p})`; }
    if (sc.panel) { d.querySelector('.panel img').style.transform = `scale(${1 + .08 * p})`; d.querySelector('.bg').style.transform = `scale(${1 + .05 * p})`; }
    if (sc.panel === 'stand.jpg') rise(d.querySelector('#standT'), t, sc.t0 + .4);
    if (sc.products) {
      d.querySelector('.plogo').style.opacity = ramp(t, sc.t0, sc.t0 + .8);
      const rows = [pimgs.slice(0, 6), pimgs.slice(6)], ys = [800, 1040], H = 190;
      rows.forEach((row, r) => {
        const ws = row.map(im => im.naturalWidth * H / im.naturalHeight);
        const gap = (980 - ws.reduce((a, b) => a + b, 0)) / (row.length - 1);
        let x = 50;
        row.forEach((im, k) => {
          const a = ramp(t, sc.t0 + .3 + (r * 6 + k) * .1, sc.t0 + .8 + (r * 6 + k) * .1);
          im.style.height = H + 'px'; im.style.left = x + 'px'; im.style.top = (ys[r] + 30 * (1 - a)) + 'px'; im.style.opacity = a; x += ws[k] + gap;
        });
      });
      rise(d.querySelector('#prodT'), t, sc.t0 + .6);
    }
    if (sc.invite) {
      d.querySelector('.panel img').style.transform = `scale(${1 + .06 * p})`;
      rise(d.querySelector('.ilogo'), t, sc.t0 + .3); rise(d.querySelector('#inv1'), t, sc.t0 + .6);
      rise(d.querySelector('#inv2'), t, sc.t0 + 4.2); rise(d.querySelector('#inv3'), t, sc.t0 + 6.4);
      rise(d.querySelector('#inv4'), t, sc.t0 + 11); rise(d.querySelector('#inv5'), t, sc.t0 + 12);
    }
  });
  const c = CAPS.find(x => t >= x[0] - .2 && t < x[1] + .3);
  if (c) {
    if (cap.dataset.h !== c[2]) { cap.innerHTML = c[2]; cap.dataset.h = c[2]; }
    cap.style.opacity = Math.min(ramp(t, c[0] - .2, c[0] + .2), 1 - ramp(t, c[1], c[1] + .3));
  } else cap.style.opacity = 0;
}
window.__render = (v, t) => render(t);
window.__dur = () => DUR;
</script>
</body>
</html>
