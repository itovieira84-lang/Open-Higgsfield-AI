<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Playfair'; font-style: normal; font-weight: 700; src: url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2); }
@font-face { font-family: 'Playfair'; font-style: italic; font-weight: 700; src: url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-italic.woff2); }
@font-face { font-family: 'Montserrat'; font-weight: 800; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2); }
@font-face { font-family: 'Montserrat'; font-weight: 700; src: url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2); }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1a0a04; }
.scene { position: absolute; inset: 0; opacity: 0; }
.bg { position: absolute; inset: -120px; background-size: cover; background-position: center; filter: blur(46px) brightness(.42) saturate(1.25); }
.panel { position: absolute; left: 60px; width: 960px; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); border: 4px solid rgba(255,240,215,.85); box-sizing: border-box; }
.panel img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
.txt { position: absolute; left: 70px; width: 940px; text-align: center; font-family: 'Playfair', serif; font-weight: 700; color: #fff6e6; font-size: 66px; line-height: 1.18; text-shadow: 0 4px 18px rgba(0,0,0,.55); font-variant-numeric: lining-nums; }
.txt em { font-style: italic; color: #ffd27a; }
.txt .l { display: block; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
#red { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #ec0a24 0%, #c80018 65%, #8f0010 100%); }
.small { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 1px; color: #fff6e6; }
.pill { display: inline-block; background: #fff6e6; color: #d10019; border-radius: 22px; padding: 10px 22px 14px; margin: 0 10px; font-family: 'Montserrat'; font-weight: 800; font-size: 74px; line-height: 1; }
.pill small { display: block; font-size: 24px; font-weight: 700; color: #d10019; letter-spacing: 1px; margin-top: 4px; }
#prodWrap img { position: absolute; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const XF = .9; // crossfade between scenes

// Each scene: image panel (real/approved art only) + text beats. Beats: [start, end, [lines]]
const SCENES = [
  { t0: 0, t1: 5.4, img: 'terra.jpg', panel: [0, 960 * 438 / 1008], kb: [1.0, 1.1, 0, -10],
    beats: [[0.6, 5.4, ['Antes da cozinha,', 'havia a <em>terra.</em>']]] },
  { t0: 5.4, t1: 9.6, img: 'ana_parede.jpg', panel: [0, 960 * 986 / 976], kb: [1.12, 1.0, 0, 0],
    beats: [[6.0, 9.6, ['Nela, uma mulher', 'chamada <em>Ana.</em>']]] },
  { t0: 9.6, t1: 13.8, img: 'mesa.jpg', panel: [0, 640], kb: [1.0, 1.1, -20, 0],
    beats: [[10.2, 13.8, ['Mãos que plantavam, colhiam', 'e reuniam todos <em>à mesa.</em>']]] },
  { t0: 13.8, t1: 19.6, type: true,
    words: [[14.2, 'Manauê.'], [15.0, 'Cocada.'], [15.8, 'Bolo de aipim.'], [16.6, 'Café passado na hora.']],
    beats: [[17.6, 19.6, ['Sabores que viraram', '<em>memória.</em>']]] },
  { t0: 19.6, t1: 25.2, img: 'legado.jpg', panel: [0, 960 * 915 / 1080], kb: [1.0, 1.08, 0, 10],
    beats: [[20.2, 22.7, ['A neta, Vanessa dos Santos,', 'guardou cada lembrança…']], [22.7, 25.2, ['…e transformou afeto', '<em>em marca.</em>']]] },
  { t0: 25.2, t1: 30.4, products: true,
    beats: [[25.8, 30.4, ['Há mais de 20 anos,', 'esse cuidado vai', '<em>da Bahia para a sua mesa.</em>']]] },
  { t0: 30.4, t1: 35.2, img: 'stand.jpg', panel: [0, 960 * 512 / 794], kb: [1.0, 1.1, 0, 0],
    beats: [[31.0, 35.2, ['Agora, a cozinha de Ana', '<em>abre as portas para você.</em>']]] },
  { t0: 35.2, t1: 43, invite: true, beats: [] },
];
// vertically center panel + text block (keeps clear of Reels UI at top/bottom)
SCENES.forEach(sc => {
  if (!sc.img) return;
  const lines = Math.max(...sc.beats.map(b => b[2].length));
  const block = sc.panel[1] + 70 + lines * 78;
  sc.panel[0] = Math.round((1920 - block) / 2 - 90);
});
const DUR = 43;

const stage = $('#stage');
const els = SCENES.map((sc, i) => {
  const d = document.createElement('div'); d.className = 'scene';
  if (sc.img) {
    d.innerHTML = `<div class="bg" style="background-image:url(${sc.img})"></div>
      <div class="panel" style="top:${sc.panel[0]}px;height:${sc.panel[1]}px"><img src="${sc.img}"></div>`;
  }
  if (sc.products) {
    d.innerHTML = `<div id="red" style="position:absolute;inset:0"></div><img src="logo_keyline.png" class="plogo" style="position:absolute;left:190px;top:300px;width:700px">
      <div id="prodWrap" style="position:absolute;inset:0"></div>`;
  }
  if (sc.type) {
    d.innerHTML = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, #9a4f2a 0%, #6e3218 60%, #3a1609 100%)"></div>
      <div class="txt words" style="top:620px;font-size:84px;line-height:1.25"></div>`;
  }
  if (sc.invite) {
    d.innerHTML = `<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #ec0a24 0%, #c80018 65%, #8f0010 100%)"></div>
      <div class="panel" style="top:250px;height:${960 * 396 / 856}px"><img src="centro.jpg"></div>
      <img src="logo_keyline.png" class="ilogo" style="position:absolute;left:290px;top:740px;width:500px">
      <div class="txt" id="inv1" style="top:930px"><span class="l">A cozinha DAANA vai ao</span><span class="l"><em>Supervendas Sergipe.</em></span></div>
      <div id="inv2" style="position:absolute;left:0;width:1080px;top:1110px;text-align:center">
        <span class="pill">26<small>OUTUBRO</small></span><span class="pill">27<small>OUTUBRO</small></span><span class="pill">28<small>OUTUBRO</small></span></div>
      <div class="small" id="inv3" style="position:absolute;left:0;width:1080px;top:1270px;text-align:center">Centro de Convenções AM Malls</div>
      <div class="txt" id="inv4" style="top:1350px;font-size:58px">Venha viver essa história<br><em>com a gente.</em></div>
      <div class="small" id="inv5" style="position:absolute;left:0;width:1080px;top:1530px;text-align:center;font-weight:800">@daanaoficial</div>`;
  }
  const txt = document.createElement('div'); txt.className = 'txt'; d.appendChild(txt);
  stage.appendChild(d); return { d, txt };
});
const vig = document.createElement('div'); vig.id = 'vig'; stage.appendChild(vig);

// real product cutouts for the products scene
const PRODS = ['005', '007', '011', 'can1', 'molho_ingles', 'dende1', 'molho4', 'cha_hortela', 'c_capim_limao', '001', '003', '002'];
const pw = document.querySelector('#prodWrap');
const pimgs = PRODS.map(n => { const i = new Image(); i.src = 'prod/' + n + '.png'; pw.appendChild(i); return i; });

function render(t) {
  SCENES.forEach((sc, i) => {
    const { d, txt } = els[i];
    const fin = i === 0 ? ramp(t, 0, .6) : ramp(t, sc.t0 - XF / 2, sc.t0 + XF / 2);
    const fout = i === SCENES.length - 1 ? ramp(t, DUR - .8, DUR) : ramp(t, sc.t1 - XF / 2, sc.t1 + XF / 2);
    const op = Math.min(fin, 1 - fout);
    d.style.opacity = op; d.style.display = op > 0 ? 'block' : 'none';
    if (op <= 0) return;
    const p = clamp((t - sc.t0 + XF / 2) / (sc.t1 - sc.t0 + XF));
    if (sc.img) {
      const [s0, s1, dx, dy] = sc.kb, s = s0 + (s1 - s0) * p;
      d.querySelector('.panel img').style.transform = `scale(${s}) translate(${dx * p}px, ${dy * p}px)`;
      d.querySelector('.bg').style.transform = `scale(${1 + .05 * p})`;
    }
    if (sc.products) {
      d.querySelector('.plogo').style.opacity = ramp(t, sc.t0, sc.t0 + .8);
      // two rows of real packshots popping in one by one
      const rows = [pimgs.slice(0, 6), pimgs.slice(6)], ys = [800, 1040], H = [190, 190];
      rows.forEach((row, r) => {
        const ws = row.map(im => im.naturalWidth * H[r] / im.naturalHeight);
        const gap = (980 - ws.reduce((a, b) => a + b, 0)) / (row.length - 1);
        let x = 50;
        row.forEach((im, k) => {
          const a = ramp(t, sc.t0 + .3 + (r * 6 + k) * .1, sc.t0 + .8 + (r * 6 + k) * .1);
          im.style.height = H[r] + 'px'; im.style.left = x + 'px'; im.style.top = (ys[r] + 30 * (1 - a)) + 'px'; im.style.opacity = a;
          x += ws[k] + gap;
        });
      });
    }
    if (sc.invite) {
      const st = (id, a) => { const e = d.querySelector(id); e.style.opacity = ramp(t, a, a + .7); e.style.transform = `translateY(${20 * (1 - ramp(t, a, a + .7))}px)`; };
      d.querySelector('.panel img').style.transform = `scale(${1 + .06 * p})`;
      st('.ilogo', sc.t0 + .4); st('#inv1', sc.t0 + .9); st('#inv2', sc.t0 + 1.6); st('#inv3', sc.t0 + 2.1); st('#inv4', sc.t0 + 2.8); st('#inv5', sc.t0 + 3.4);
    }
    if (sc.type) {
      const w = d.querySelector('.words'), out = ramp(t, 17.1, 17.6);
      const html = sc.words.map(x => `<span class="l">${x[1]}</span>`).join('');
      if (w.dataset.h !== html) { w.innerHTML = html; w.dataset.h = html; }
      [...w.children].forEach((l, k) => { const a = ramp(t, sc.words[k][0], sc.words[k][0] + .6); l.style.opacity = a * (1 - out); l.style.transform = `translateY(${18 * (1 - a)}px)`; });
    }
    // text beats
    const beat = sc.beats.find(b => t >= b[0] - .01 && t < b[1]) || sc.beats[sc.beats.length - 1];
    if (!beat) { txt.innerHTML = ''; return; }
    const html = beat[2].map(l => `<span class="l">${l}</span>`).join('');
    if (txt.dataset.h !== html) { txt.innerHTML = html; txt.dataset.h = html; }
    const isLastBeat = beat === sc.beats[sc.beats.length - 1];
    const bout = isLastBeat ? 0 : ramp(t, beat[1] - .35, beat[1]);
    [...txt.children].forEach((l, k) => {
      const a = ramp(t, beat[0] + k * .35, beat[0] + .7 + k * .35);
      l.style.opacity = a * (1 - bout); l.style.transform = `translateY(${18 * (1 - a)}px)`;
    });
    const top = sc.products ? 1290 : sc.type ? 820 : sc.panel[0] + sc.panel[1] + 70;
    txt.style.top = top + 'px';
  });
}
window.__render = (v, t) => render(t);
window.__dur = () => DUR;
</script>
</body>
</html>
